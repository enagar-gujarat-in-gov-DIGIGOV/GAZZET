<!doctype html>
<html>
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>QR Generator Demo</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
body{font-family:Arial;background:#f3f5f7;margin:0}.box{max-width:600px;margin:45px auto;background:#fff;padding:30px;border-radius:14px;box-shadow:0 8px 30px #0001}input{width:100%;padding:13px;margin:8px 0 14px;border:1px solid #bbb;border-radius:7px;font-size:16px}button{background:#17365d;color:white;border:0;padding:12px 18px;border-radius:7px;cursor:pointer}#qr{margin:25px auto;text-align:center}
</style></head>
<body><div class="box"><h1>QR Code Generator</h1>
<p>Demo: enter the URL of your PDF viewer.</p>
<input id="url" value="viewer.html?id=26091696">
<button onclick="generate()">Generate QR</button>
<div id="qr"></div></div>
<script>
function generate(){document.getElementById("qr").innerHTML="";
new QRCode(document.getElementById("qr"),{text:document.getElementById("url").value,width:260,height:260});}
generate();
</script></body></html>
